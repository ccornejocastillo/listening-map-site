<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Listening map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --text: #F2F2F2;
    --secondary: #9A9A9A;
    --border: #262626;
    --accent: #4D7CFF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    line-height: 1.5;
  }
  main { max-width: 880px; margin: 0 auto; padding: 48px 16px; }
  .dates { font-family: "IBM Plex Mono", monospace; font-size: 13px; color: var(--secondary); letter-spacing: .04em; text-transform: uppercase; }
  h1 { font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: clamp(36px, 7vw, 56px); line-height: 1.05; margin: 8px 0 32px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  .stat { display: flex; flex-direction: column; gap: 4px; padding: 20px 0; }
  .stat + .stat { border-left: 1px solid var(--border); padding-left: 20px; }
  .num { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 32px; }
  .label { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--secondary); text-transform: uppercase; letter-spacing: .04em; }
  footer { margin-top: 64px; padding-top: 16px; border-top: 1px solid var(--border); font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--secondary); }
  @media (max-width: 560px) {
    .stats { grid-template-columns: 1fr; }
    .stat + .stat { border-left: 0; padding-left: 0; border-top: 1px solid var(--border); }
  }
</style>
</head>
<body>
<main>
  <header>
    <div class="dates">Oct 14 – Oct 21, 2026</div>
    <h1>Listening map</h1>
    <div class="stats">
      <div class="stat"><span class="num">55</span><span class="label">tracks played</span></div>
      <div class="stat"><span class="num">20</span><span class="label">artists</span></div>
      <div class="stat"><span class="num">0</span><span class="label">recommendations merged</span></div>
    </div>
  </header>
  <footer>Last updated Oct 21, 2026, 16:09 (Santiago)</footer>
</main>
</body>
</html>
